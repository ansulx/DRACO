amp: true
balance_classes: true
batch_size: 16
binary: true
blr: 0.005
cosine: true
data:
  class_weights: data/processed/glaucoma/stats/airogs_light_class_weights.json
  image_size: 224
  test_csv: data/processed/glaucoma/catalogs/airogs_light_test.csv
  train_csv: data/processed/glaucoma/catalogs/airogs_light_train.csv
epochs: 40
head_warmup_epochs: 5
layer_decay: 0.65
min_lr: 1.0e-06
modality: fundus
model:
