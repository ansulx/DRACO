amp: true
balance_classes: true
batch_size: 32
binary: true
data:
  class_weights: data/processed/glaucoma/stats/harvard_gd_class_weights.json
  image_size: 224
  test_csv: data/processed/glaucoma/catalogs/harvard_gd_test.csv
  train_csv: data/processed/glaucoma/catalogs/harvard_gd_train.csv
epochs: 50
lr: 0.0001
modality: rnflt
model:
  name: efficientnet_b0
  pretrained: true
monitor: accuracy
num_classes: 2
num_workers: 4
patience: 12
run_name: glauco_efficientnet_harvard_gd_acc_plain
seed: 42
weight_decay: 0.01
