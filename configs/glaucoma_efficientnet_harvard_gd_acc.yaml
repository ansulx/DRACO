# GLAUCO — Harvard-GD OCT Acc peak (monitor accuracy; reclaim ~0.86 history)
run_name: glauco_efficientnet_harvard_gd_acc
modality: rnflt
binary: true
num_classes: 2
monitor: accuracy

model:
  name: efficientnet_b0
  pretrained: true

data:
  train_csv: data/processed/glaucoma/catalogs/harvard_gd_train.csv
  test_csv: data/processed/glaucoma/catalogs/harvard_gd_test.csv
  class_weights: data/processed/glaucoma/stats/harvard_gd_class_weights.json
  image_size: 224

batch_size: 32
epochs: 60
patience: 15
lr: 0.0001
weight_decay: 0.01
cosine: true
warmup_epochs: 5
min_lr: 1.0e-6
loss:
  name: ce
  label_smoothing: 0.05
amp: true
num_workers: 4
seed: 42
balance_classes: true
