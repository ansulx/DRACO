# GLAUCO — EfficientNet on Harvard-GF (official 2100 train / 300 val early-stop / 900 test)
run_name: glauco_efficientnet_harvard_gf_full
modality: rnflt
binary: true
num_classes: 2
monitor: auc

model:
  name: efficientnet_b0
  pretrained: true

data:
  train_csv: data/processed/glaucoma/catalogs/harvard_gf_train.csv
  test_csv: data/processed/glaucoma/catalogs/harvard_gf_val.csv
  class_weights: data/processed/glaucoma/stats/harvard_gf_class_weights.json
  image_size: 224

batch_size: 32
epochs: 50
patience: 12
lr: 0.0001
weight_decay: 0.01
amp: true
num_workers: 4
seed: 42
balance_classes: true
