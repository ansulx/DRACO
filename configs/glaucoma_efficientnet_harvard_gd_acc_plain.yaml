# GLAUCO — Harvard-GD Acc peak, same recipe as full but monitor=accuracy
# (history hit Acc 0.86 @ ep22 under this backbone; AUC-monitor kept ep26 Acc 0.83)
run_name: glauco_efficientnet_harvard_gd_acc_plain
modality: rnflt
binary: true
num_classes: 2
monitor: accuracy

model:
  name: efficientnet_b0
  pretrained: true

data:
  train_csv: data/processed/glaucoma/catalogs/harvard_gd_train.csv
  test_csv: data/processed/glaucoma/catalogs/harvard_gd_test.csv
  class_weights: data/processed/glaucoma/stats/harvard_gd_class_weights.json
  image_size: 224

batch_size: 32
epochs: 50
patience: 12
lr: 0.0001
weight_decay: 0.01
amp: true
num_workers: 4
seed: 42
balance_classes: true
