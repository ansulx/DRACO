# RETFound OCT + Focal Loss (class-weighted) on MMRDR DME
# Same fine-tune recipe as v2; loss focuses on hard / rare NCI-DME.

run_name: retfound_mmrdr_focal
seed: 42
device: null
batch_size: 8
num_workers: 2
num_classes: 3
binary: false
epochs: 50
patience: 15
blr: 5.0e-3
lr: null
layer_decay: 0.65
warmup_epochs: 10
min_lr: 1.0e-6
cosine: true
head_warmup_epochs: 5
weight_decay: 0.05
amp: true

loss:
  name: focal
  gamma: 2.0
  label_smoothing: 0.05

model:
  name: retfound
  pretrained: false
  checkpoint: checkpoints/weights/RETFound_oct.pth

data:
  train_csv: data/processed/catalogs/mmrdr_train.csv
  test_csv: data/processed/catalogs/mmrdr_test.csv
  class_weights: data/processed/stats/class_weights.json
  image_size: 224
