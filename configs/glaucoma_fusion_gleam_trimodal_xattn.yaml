# GLAUCO — Tri-modal cross-attention on GLEAM (SLO + Thickness + VF)
# Compare against HAMM 2026 (arXiv:2603.12800)
run_name: glauco_fusion_gleam_trimodal_xattn
binary: false
num_classes: 4
monitor: macro_f1
keep_frozen: true

fusion:
  enabled: true
  trimodal: true
  type: cross_attention
  keep_frozen: true
  embed_dim: 512
  num_heads: 8
  dropout: 0.1
  oct:
    name: efficientnet_b0
    pretrained: true
    freeze: true
  fundus:
    name: efficientnet_b0
    pretrained: true
    freeze: true
  vf:
    name: efficientnet_b0
    pretrained: true
    freeze: true

data:
  train_csv: data/processed/glaucoma/catalogs/gleam_paired_train.csv
  test_csv: data/processed/glaucoma/catalogs/gleam_paired_val.csv
  class_weights: data/processed/glaucoma/stats/gleam_paired_class_weights.json
  image_size: 224

batch_size: 16
epochs: 40
patience: 12
blr: 0.01
head_warmup_epochs: 0
warmup_epochs: 5
cosine: true
min_lr: 1.0e-6
weight_decay: 0.05
backbone_lr_scale: 0.1
amp: true
num_workers: 2
seed: 42
balance_classes: true
