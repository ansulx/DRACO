# GLAUCO — Binary dual fusion on GLEAM (any glaucoma vs normal)
run_name: glauco_fusion_gleam_binary_xattn
binary: true
num_classes: 2
monitor: auc
keep_frozen: true

fusion:
  enabled: true
  type: cross_attention
  keep_frozen: true
  embed_dim: 512
  num_heads: 8
  dropout: 0.1
  oct:
    name: efficientnet_b0
    pretrained: true
    freeze: true
  fundus:
    name: efficientnet_b0
    pretrained: true
    freeze: true

data:
  train_csv: data/processed/glaucoma/catalogs/gleam_paired_train.csv
  test_csv: data/processed/glaucoma/catalogs/gleam_paired_val.csv
  image_size: 224

batch_size: 16
epochs: 40
patience: 12
blr: 0.01
warmup_epochs: 5
cosine: true
min_lr: 1.0e-6
weight_decay: 0.05
amp: true
num_workers: 2
seed: 42
balance_classes: true
