# Learnable logit-gate fusion on OEFI pairs
run_name: ghota_oefi_fusion_late
fusion_type: late_learnable
seed: 42
epochs: 40
patience: 12
batch_size: 4
num_workers: 2
lr: 1.0e-2
weight_decay: 0.0
amp: true
image_size: 224
test_size: 0.25
target: dr
oct_checkpoint: checkpoints/ghota_oct_dme_retfound_sota/best.pt
fundus_checkpoint: checkpoints/ghota_fundus_dr_retfound_sota/best.pt
pairs_csv: data/processed/ghota/catalogs/ghota_oefi_paired.csv
