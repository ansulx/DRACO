# GLAUCO — Tri-modal late fusion on GLEAM (ablation baseline)
run_name: glauco_fusion_gleam_trimodal_late
binary: false
num_classes: 4
monitor: macro_f1
keep_frozen: true

fusion:
  enabled: true
  trimodal: true
  type: late
  keep_frozen: true
  embed_dim: 512
  dropout: 0.1
  oct:
    name: efficientnet_b0
    pretrained: true
    freeze: true
  fundus:
    name: efficientnet_b0
    pretrained: true
    freeze: true
  vf:
    name: efficientnet_b0
    pretrained: true
    freeze: true

data:
  train_csv: data/processed/glaucoma/catalogs/gleam_paired_train.csv
  test_csv: data/processed/glaucoma/catalogs/gleam_paired_val.csv
  class_weights: data/processed/glaucoma/stats/gleam_paired_class_weights.json
  image_size: 224

batch_size: 16
epochs: 40
patience: 12
blr: 0.01
warmup_epochs: 5
cosine: true
min_lr: 1.0e-6
weight_decay: 0.05
amp: true
num_workers: 2
seed: 42
balance_classes: true
