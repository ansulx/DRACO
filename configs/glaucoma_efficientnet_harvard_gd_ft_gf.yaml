# GLAUCO — fine-tune Harvard-GD from GF EfficientNet warm-start
run_name: glauco_efficientnet_harvard_gd_ft_gf
modality: rnflt
binary: true
num_classes: 2
monitor: accuracy
init_checkpoint: checkpoints/glauco_efficientnet_harvard_gf_full/best.pt

model:
  name: efficientnet_b0
  pretrained: true

data:
  train_csv: data/processed/glaucoma/catalogs/harvard_gd_train.csv
  test_csv: data/processed/glaucoma/catalogs/harvard_gd_test.csv
  class_weights: data/processed/glaucoma/stats/harvard_gd_class_weights.json
  image_size: 224

batch_size: 32
epochs: 30
patience: 10
lr: 3.0e-5
weight_decay: 0.01
cosine: true
warmup_epochs: 3
min_lr: 1.0e-6
loss:
  name: ce
  label_smoothing: 0.05
amp: true
num_workers: 4
seed: 42
balance_classes: true
